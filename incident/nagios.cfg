define host {
    use                     linux-server
    host_name               quotelab-incident
    address                 127.0.0.1
    check_command           check-host-alive
    notifications_enabled   0
}

define command {
    command_name    check_quotelab_incident_health
    command_line    /usr/lib/nagios/plugins/check_http -H $HOSTADDRESS$ -p 18787 -u /health -e "HTTP/1.1 200" -s '"status":"ok"' -t 5
}

define service {
    use                     generic-service
    host_name               quotelab-incident
    service_description     QuoteLab HTTP health
    check_command           check_quotelab_incident_health
    check_interval          0.166667
    retry_interval          0.166667
    max_check_attempts      1
    notifications_enabled   0
}
